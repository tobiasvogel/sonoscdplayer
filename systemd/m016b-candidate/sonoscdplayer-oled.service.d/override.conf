# M0.16b candidate. Install only after manual hardware acceptance.
# Keep the existing firmware splash adoption and ambient contrast loop.
[Service]
RuntimeDirectory=sonoscdplayer-ui
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=/home/pi/sonoscdplayer-tests/.venv/bin/python -u -m integrations.outputs.oled_status --socket /run/sonoscdplayer/control.sock --gpio --execute --seconds 0 --adopt-boot-splash --ambient-auto --ui-modern --cover auto --ui-events-socket /run/sonoscdplayer-ui/events.sock --oled-recover-on-error
