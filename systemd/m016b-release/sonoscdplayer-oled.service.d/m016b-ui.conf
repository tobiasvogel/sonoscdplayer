# M0.16b production candidate; install only after validating the production venv.
[Service]
RuntimeDirectory=sonoscdplayer-ui
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=/home/pi/sonoscdplayer/.venv/bin/python -u -m integrations.outputs.oled_status --socket /run/sonoscdplayer/control.sock --gpio --execute --seconds 0 --adopt-boot-splash --ambient-auto --ui-modern --ui-config /home/pi/sonoscdplayer/ui.toml --cover auto --ui-events-socket /run/sonoscdplayer-ui/events.sock --oled-recover-on-error --ui-power-actions
