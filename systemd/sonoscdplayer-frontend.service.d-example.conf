# EXAMPLE ONLY. Adapt for the actual frontend service unit.
# The early boot LED must be stopped before the regular LED owner starts.
# Do not use Conflicts= here: in the same boot transaction systemd would drop
# the early LED start job entirely. Stop it explicitly instead.
[Unit]
After=sonoscdplayer-early-power-led.service

[Service]
ExecStartPre=-+/usr/bin/systemctl stop sonoscdplayer-early-power-led.service
