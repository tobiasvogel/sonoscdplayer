/* --- SonosCDPlayer dual appearance system (prototype only) --- */
:root { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#15120f;
  --surface:#261e18;
  --surface2:#2e251f;
  --ink:#f7ecdf;
  --muted:#b8a597;
  --line:#493b31;
  --accent:#f6ac42;
  --accent-hover:#ffca77;
  --accent-soft:#39291d;
  --gold:#dda15c;
  --shadow:0 18px 58px rgba(0,0,0,.25);
}
:root[data-theme="dark"] body {
  background:radial-gradient(circle at 76% 8%,#281d16 0%,#15120f 45%);
}
:root[data-theme="dark"] .rail {background:#100e0c;color:#f6eade}
:root[data-theme="dark"] .brand-mark {border-color:#90633b;color:#f6b452}
:root[data-theme="dark"] .brand small {color:#ba9b7d}
:root[data-theme="dark"] .navbtn {color:#bdafa3}
:root[data-theme="dark"] .navbtn:hover {background:#32271f;color:#fff5e8}
:root[data-theme="dark"] .navbtn.active {background:#403026;color:#fff4e2;box-shadow:inset 3px 0 #f6ac42}
:root[data-theme="dark"] .railfoot {color:#b19c8a;border-color:#392c23}
:root[data-theme="dark"] .railfoot strong {color:#f6ebdb}
:root[data-theme="dark"] .dot {background:#76c5a6}
:root[data-theme="dark"] .chip {background:#2b231d;color:#e1cdb7}
:root[data-theme="dark"] .avatar {background:#42301f;color:#ffcd80}
:root[data-theme="dark"] .preview-banner {background:#2c241e;color:#cab9ab;border:1px solid #44372c}
:root[data-theme="dark"] .art-card {background:#241d18}
:root[data-theme="dark"] .art {
  background:
  radial-gradient(circle at 24% 24%,#d5a260 0 5%,transparent 30%),
  radial-gradient(circle at 83% 87%,#21373a 0 14%,transparent 45%),
  linear-gradient(135deg,#687c6e 0%,#3c625e 48%,#213e46 100%);
}
:root[data-theme="dark"] .art-title {color:#fffbef}
:root[data-theme="dark"] .format {color:#f6c892;background:#413429}
:root[data-theme="dark"] .track-artist {color:#d2bdae}
:root[data-theme="dark"] .smallmeta,
:root[data-theme="dark"] .times {color:#a99a8d}
:root[data-theme="dark"] .progress {accent-color:#f6ac42}
:root[data-theme="dark"] .ctrl {color:#f5e8d8}
:root[data-theme="dark"] .ctrl:hover {background:#3a2d24}
:root[data-theme="dark"] .ctrl.primary {background:#f6ad45;color:#211810}
:root[data-theme="dark"] .ctrl.primary:hover {background:#ffc26b}
:root[data-theme="dark"] .destination {background:#2b231d}
:root[data-theme="dark"] .destination .speaker-icon {background:#423124;color:#ffc575}
:root[data-theme="dark"] .trackrow .num,
:root[data-theme="dark"] .trackrow .duration {color:#b7a496}
:root[data-theme="dark"] .trackrow.active {background:#3a2b20;color:#ffca81}
:root[data-theme="dark"] .settings-nav {background:#231c17}
:root[data-theme="dark"] .settings-nav button {color:#c2aea1}
:root[data-theme="dark"] .settings-nav button.active {background:#433022;color:#ffbe64}
:root[data-theme="dark"] .settings-nav button:hover:not(.active) {background:#382c23}
:root[data-theme="dark"] .panel {background:#261e18}
:root[data-theme="dark"] .panel p,
:root[data-theme="dark"] .modal p {color:#bba99b}
:root[data-theme="dark"] .panel h3 {color:#e9c298}
:root[data-theme="dark"] .field label {color:#d9c2b0}
:root[data-theme="dark"] .field input,
:root[data-theme="dark"] .field select {background:#1c1713;border-color:#584538;color:#f5e8da}
:root[data-theme="dark"] .field input:focus-visible,
:root[data-theme="dark"] .field select:focus-visible {outline:2px solid #f4ac46}
:root[data-theme="dark"] .help,
:root[data-theme="dark"] .panel-footer {color:#b8a597}
:root[data-theme="dark"] .btn {background:#eaa03a;color:#21170e}
:root[data-theme="dark"] .btn:hover {background:#ffc36b}
:root[data-theme="dark"] .btn.secondary {background:#3c2d22;color:#ffd5a1}
:root[data-theme="dark"] .btn.secondary:hover {background:#553c2a}
:root[data-theme="dark"] .btn.danger {background:#a54840;color:#fff8f4}
:root[data-theme="dark"] .pill-note {background:#352b20;color:#e2caa4}
:root[data-theme="dark"] .tag {background:#443226;color:#f5bb72}
:root[data-theme="dark"] .modal-backdrop {background:rgba(6,5,3,.74)}
:root[data-theme="dark"] .modal {background:#2a211b}
:root[data-theme="dark"] .toast {background:#563820;color:#fff4e5}
:root[data-theme="dark"] button:focus-visible,
:root[data-theme="dark"] a:focus-visible,
:root[data-theme="dark"] input:focus-visible,
:root[data-theme="dark"] select:focus-visible {outline-color:#f7b553}
/* Identical navigation and component geometry in both themes. */
.theme-switcher {
  display:inline-flex;gap:3px;align-items:center;
  border:1px solid var(--line);background:var(--surface);
  padding:3px;border-radius:999px;flex-shrink:0;
}
.theme-switcher button {
  background:transparent;border:0;color:var(--muted);border-radius:999px;
  padding:8px 11px;font-size:12px;font-weight:700;white-space:nowrap;
}
.theme-switcher button:hover:not(.active) {background:var(--surface2);color:var(--ink)}
.theme-switcher button.active {background:var(--ink);color:var(--surface)}
:root[data-theme="dark"] .theme-switcher button.active {background:#f6ac42;color:#22180e}
.theme-detail {font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
.theme-example {
  display:flex;gap:9px;align-items:center;padding:14px 16px;
  background:var(--surface2);border:1px solid var(--line);
  border-radius:12px;margin:20px 0 4px;
}
.theme-example .swatch {height:26px;width:26px;border-radius:8px;background:var(--accent);flex-shrink:0}
.theme-example .theme-example-label {font-size:13px;font-weight:600}
@media(max-width:1100px){ .topright .avatar {display:none} }
@media(max-width:750px){
  .topbar {flex-wrap:wrap;gap:16px}
  .topright {width:100%;justify-content:flex-start}
  .theme-switcher button {padding:8px 13px}
  .topright .chip,.topright .avatar {display:none}
}
@media(max-width:375px){
  .theme-switcher button {padding:8px 10px;font-size:11px}
}


.cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;border-radius:13px}
.cover-image[hidden]{display:none}
.chip .dot.offline,.railfoot .dot.offline{background:#bc6058}
input[readonly],select:disabled,input:disabled{opacity:.7;cursor:not-allowed}
.art-title{overflow-wrap:anywhere}
@media(max-width:750px){.art-title{font-size:clamp(30px,9vw,56px)}}

.read-only-note{display:flex;align-items:center;gap:10px;padding:16px 1px 20px;color:var(--muted);font-size:13px;line-height:1.4}
.read-only-note span:first-child{font-size:20px;color:var(--accent)}
:root[data-theme="dark"] .read-only-note span:first-child{color:#f6ac42}
/* WEB-03b: compact release comparison, also on narrow phones. */
.release-status{margin:12px 0!important;font-size:12px!important}
.release-list{display:grid;gap:8px;margin-top:12px}
.release-choice{display:flex;gap:12px;justify-content:space-between;align-items:center;min-width:0;width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:12px 14px;text-align:left;border-radius:11px}
.release-choice:hover,.release-choice:focus-visible{border-color:var(--accent)}
.release-choice strong{display:block;overflow-wrap:anywhere;font-size:13px}
.release-choice small{display:block;color:var(--muted);font-size:11px;margin-top:5px;overflow-wrap:anywhere}
.release-choice .tag{flex-shrink:0}
.release-detail,.release-confirm{background:var(--surface2);color:var(--ink);padding:16px;border:1px solid var(--line);border-radius:13px;margin-top:14px;overflow-wrap:anywhere}
.release-detail h4{font-size:16px;margin:0 0 5px}.release-detail p{margin:0 0 12px!important}
.release-detail ol{font-size:12px;line-height:1.7;padding-left:25px;max-height:280px;overflow:auto}
.release-detail li{padding-right:8px;border-bottom:1px solid var(--line)}
.release-confirm p{margin:8px 0 14px!important}
.release-confirm .twoactions{margin-top:12px}
.release-detail[hidden],.release-confirm[hidden]{display:none}
@media(max-width:480px){.release-choice{align-items:flex-start}.release-confirm .twoactions{flex-direction:column}.release-confirm .btn{width:100%}}
.cover-manual-row{align-items:flex-start}.cover-manual-row .twoactions{justify-content:flex-end}.cover-upload-label{display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap}.cover-upload-label.disabled{opacity:.4;cursor:not-allowed}.cover-manual-row small{max-width:420px}.cover-manual-row .btn{white-space:normal}#cover-upload-status{display:block;margin-top:10px}@media(max-width:650px){.cover-manual-row{flex-direction:column}.cover-manual-row .twoactions{justify-content:flex-start}}

.library-tools{display:grid;gap:8px;margin:14px 0}.library-tools label{font-size:12px;font-weight:700;color:var(--muted)}
.library-search-line{display:flex;gap:8px;flex-wrap:wrap}.library-search-line input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px;font:inherit}
.library-items{display:grid;gap:7px}.library-entry{display:block;width:100%;text-align:left;padding:14px 15px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:12px}.library-entry:hover,.library-entry:focus-visible{border-color:var(--accent)}.library-entry strong{display:block;font-size:14px;overflow-wrap:anywhere}.library-entry small{display:block;color:var(--muted);margin-top:6px;font-size:12px}.library-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:17px 0}.library-pager span{font-size:12px;color:var(--muted)}.library-detail{padding:17px;margin:15px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface2);overflow-wrap:anywhere}.library-detail h3{margin:0 0 6px}.library-detail ol{padding-left:25px;font-size:13px;line-height:1.8}.library-detail .library-meta{font-size:12px;color:var(--muted)}
.library-edit-fields{display:grid;gap:12px;margin:17px 0;border-top:1px solid var(--line);padding-top:16px}.library-edit-field{display:grid;gap:5px;font-size:12px;font-weight:650}.library-edit-field input,.library-edit-field select{max-width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:10px}.library-manage-actions{display:flex;flex-wrap:wrap;gap:8px}.library-manage-actions .btn{white-space:normal;text-align:center}
.library-select-row{display:flex;align-items:center;gap:11px}.library-select-row input[type="checkbox"]{width:18px;height:18px;flex:none;accent-color:var(--accent)}.library-select-row .library-entry{flex:1;min-width:0}.library-bulk-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.library-stats{padding:15px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;margin:15px 0}.library-stats strong{display:block;margin-bottom:8px}.library-stats .library-stats-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.library-stats .help{margin:0 0 7px}
@media(max-width:450px){.library-search-line .btn{padding:10px}.library-pager .btn{padding:9px 12px}.library-manage-actions .btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
<aside class="rail"><div class="brand"><div class="brand-mark" aria-hidden="true">◉</div><div class="brand-word">SonosCDPlayer<small data-i18n="web.brand.tagline"></small></div></div><nav class="railnav" data-i18n-aria-label="web.text.main_navigation"><button class="navbtn active" data-page="playback"><span class="ico" aria-hidden="true">♫</span><span class="nav-text" data-i18n="web.text.playback"></span></button><button class="navbtn" data-page="settings"><span class="ico" aria-hidden="true">⚙</span><span class="nav-text" data-i18n="web.text.settings"></span></button></nav><div class="railfoot"><span class="dot"></span><strong id="device-reachable" data-i18n="web.text.connecting"></strong><p><span data-i18n="web.text.local_web_client"></span><br><span data-i18n="web.text.port_8081"></span></p></div></aside>
<main class="main"><div class="topbar"><div><div class="eyebrow" id="eyebrow" data-i18n="web.text.listen_to_music"></div><h1 class="page-title" id="pagetitle" data-i18n="web.text.now_playing"></h1></div><div class="topright">
  <div class="theme-switcher" role="group" data-i18n-aria-label="web.text.choose_color_theme">
    <button type="button" data-theme-choice="auto" aria-pressed="true" class="active" data-i18n-title="web.text.follow_device_setting" data-i18n="web.text.auto"></button>
    <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n-title="web.text.light_teal_theme" data-i18n="web.text.light"></button>
    <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n-title="web.text.dark_warm_theme" data-i18n="web.text.dark"></button>
  </div>
  <div class="chip"><span class="dot"></span><span id="connection-label" data-i18n="web.text.connecting"></span></div><div class="avatar" aria-hidden="true">CD</div></div></div>
<div class="preview-banner"><strong data-i18n="web.text.playback_overview_read_only"></strong> <span data-i18n="web.text.control_playback_on_the_cd_player_or_in"></span></div>
<section class="screen active" id="playback"><div class="player-grid"><div class="art-card"><div class="art" id="cover-art" role="img" data-i18n-aria-label="web.text.album_art_or_decorative_placeholder"><div class="art-title" id="art-placeholder"><small>SONOS CD PLAYER</small>CD<br> AUDIO</div><img id="cover-image" class="cover-image" data-i18n-alt="web.text.album_cover" hidden></div><div class="art-bottom"><small><span id="art-album" data-i18n="web.text.no_cd_detected"></span></small><span class="format">CD AUDIO</span></div></div><div class="player-right"><div class="playing-label"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="player-status" data-i18n="web.text.disconnected"></span></div><h2 class="track-title" id="track-title" data-i18n="web.text.no_playback"></h2><p class="track-artist" id="track-artist">—</p><div class="smallmeta" id="track-info" data-i18n="web.text.no_cd_information_yet"></div><input class="progress" type="range" value="36" min="0" max="100" data-i18n-aria-label="web.text.playback_position_read_only" disabled><div class="times"><span id="elapsed">—</span><span id="duration">—</span></div><div class="read-only-note" role="note"><span aria-hidden="true">♫</span><span data-i18n="web.text.control_playback_and_speakers_on_the_device_or"></span></div><div class="destination"><div class="speaker-icon" aria-hidden="true">◖))</div><div class="dest-details"><small id="target-label" data-i18n="web.text.sonos_target"></small><strong><span id="target-name" data-i18n="web.text.no_selection_loaded"></span></strong></div></div></div></div><div class="section-heading"><h2 data-i18n="web.text.track_list"></h2><button class="textbtn" id="edit-metadata" data-i18n="web.text.edit_metadata"></button></div><div class="tracklist" id="tracks" aria-live="polite"><div class="trackrow" data-i18n="web.text.no_track_list_available"></div></div></section>
<section class="screen" id="settings"><div class="settings-layout"><nav class="settings-nav" data-i18n-aria-label="web.text.settings_sections"><button data-panel="metadata" class="active" data-i18n="web.text.metadata"></button><button data-panel="library" data-i18n="web.text.cd_library"></button><button data-panel="audio" data-i18n="web.text.playback"></button><button data-panel="display" data-i18n="web.text.display"></button><button data-panel="network" data-i18n="web.text.network"></button><button data-panel="system" data-i18n="web.text.device"></button></nav><div class="panel">
<div class="subpanel active" id="metadata"><h2 data-i18n="web.text.cd_metadata"></h2><p data-i18n="web.text.correct_the_album_and_tracks_on_the_inserted"></p>
<div class="fieldgrid">
<div class="field"><label for="album"><span data-i18n="web.text.album_title"></span> <span class="tag" id="meta-source" data-i18n="web.text.loading_source"></span></label><input id="album" maxlength="160" autocomplete="off" disabled></div>
<div class="field"><label for="artist" data-i18n="web.text.album_artist"></label><input id="artist" maxlength="160" autocomplete="off" disabled></div>
<div class="field span"><label for="meta-track-select" data-i18n="web.text.track_to_edit"></label><select id="meta-track-select" disabled><option data-i18n="web.text.no_cd"></option></select></div>
<div class="field"><label for="title2" data-i18n="web.text.track_title"></label><input id="title2" maxlength="160" autocomplete="off" disabled></div>
<div class="field"><label for="meta-track-artist" data-i18n="web.text.track_artist"></label><input id="meta-track-artist" maxlength="160" autocomplete="off" disabled></div>
</div>
<div class="pill-note" data-i18n="web.text.empty_fields_remove_a_manual_correction_automatically_retrieved"></div>
<div class="panel-footer"><span id="meta-edit-status" role="status" data-i18n="web.text.waiting_for_cd_metadata"></span><div class="twoactions"><button class="btn secondary" id="meta-discard" disabled data-i18n="web.text.discard"></button><button class="btn" id="meta-save" disabled data-i18n="web.text.save_changes"></button></div></div>
<h3 data-i18n="web.text.album_cover"></h3>
<div class="record cover-manual-row"><div><strong data-i18n="web.text.add_custom_cover"></strong><small data-i18n="web.text.jpeg_or_png_up_to_4_mib_the"></small></div><div class="twoactions"><label class="btn secondary cover-upload-label" id="cover-upload-label" for="cover-upload" data-i18n="web.text.choose_image"></label><input type="file" id="cover-upload" accept="image/jpeg,image/png" hidden disabled><button class="btn danger" id="cover-remove" disabled data-i18n="web.text.remove_custom_cover"></button></div></div>
<p id="cover-upload-status" class="help" role="status" data-i18n="web.text.no_custom_cover_saved"></p>
<h3 data-i18n="web.text.release_association"></h3>
<div class="record"><div><strong data-i18n="web.text.choose_a_musicbrainz_release"></strong><small data-i18n="web.text.compare_editions_and_explicitly_assign_the_correct_one"></small></div><button class="btn secondary" id="release-search" disabled data-i18n="web.text.search_releases"></button></div>
<p id="release-status" class="release-status" role="status" data-i18n="web.text.no_release_search_performed_yet"></p>
<div class="release-list" id="release-list" data-i18n-aria-label="web.text.musicbrainz_releases"></div>
<div class="release-detail" id="release-detail" hidden></div>
<div class="release-confirm" id="release-confirm" hidden>
  <strong data-i18n="web.text.release_change_and_protected_fields"></strong>
  <p id="release-confirm-text" data-i18n="web.text.what_should_happen_to_existing_manual_corrections"></p>
  <div class="twoactions"><button class="btn secondary" id="release-keep" data-i18n="web.text.keep_corrections"></button><button class="btn danger" id="release-drop" data-i18n="web.text.discard_corrections"></button><button class="btn secondary" id="release-cancel" data-i18n="web.text.cancel"></button></div>
</div></div>
<div class="subpanel" id="library"><h2 data-i18n="web.text.cd_library"></h2><p data-i18n="web.text.browse_stored_cds_and_correct_them_even_without"></p>
<div class="library-tools"><label for="library-search" data-i18n="web.text.search_library"></label><div class="library-search-line"><input id="library-search" type="search" maxlength="80" data-i18n-placeholder="web.text.album_artist_or_track"><button class="btn secondary" id="library-find" data-i18n="web.text.search"></button><button class="btn secondary" id="library-reload" data-i18n="web.text.refresh"></button></div></div>
<p class="help" id="library-status" role="status" data-i18n="web.text.library_not_loaded_yet"></p>
<div class="library-items" id="library-items" data-i18n-aria-label="web.text.stored_cds"></div>

<div class="library-bulk-actions"><span class="help" id="library-selected-count" data-i18n="web.text.0_cds_selected"></span><button class="btn danger" id="library-delete-selected" disabled data-i18n="web.text.delete_selected_cds"></button><button class="btn secondary" id="library-selection-clear" disabled data-i18n="web.text.clear_selection"></button></div>
<div class="library-pager"><button class="btn secondary" id="library-prev" disabled data-i18n="web.text.previous"></button><span id="library-count" data-i18n="web.text.0_entries"></span><button class="btn secondary" id="library-next" disabled data-i18n="web.text.next"></button></div>
<div id="library-detail" class="library-detail" hidden aria-live="polite"></div>
<div class="library-stats"><strong data-i18n="web.text.storage_overview"></strong><p class="help" id="library-stats" data-i18n="web.text.storage_information_not_loaded_yet"></p><p class="help" id="library-maintenance-status" role="status"></p><div class="library-stats-actions"><button class="btn secondary" id="library-refresh-stats" data-i18n="web.text.refresh_storage_information"></button><button class="btn secondary" id="library-prune-auto" disabled data-i18n="web.text.delete_unused_automatic_covers"></button></div><p class="help" data-i18n="web.text.manually_uploaded_and_shared_covers_are_preserved_during"></p></div>
<h3 data-i18n="web.text.inserted_cd"></h3><div class="record"><div><strong id="library-current" data-i18n="web.text.inserted_cd"></strong><small data-i18n="web.text.use_the_separate_metadata_editor_for_the_inserted"></small></div><button class="btn secondary" id="delete-disc" data-i18n="web.text.reset_cd_entry"></button></div><div class="panel-footer"><span data-i18n="web.text.deleting_all_metadata_requires_an_ejected_cd_stopped"></span><button class="btn danger" id="delete-all" disabled data-i18n="web.text.delete_all_metadata"></button></div></div>
<div class="subpanel" id="audio"><h2 data-i18n="web.text.playback"></h2><p data-i18n="web.text.basic_settings_for_reading_and_playing_cds"></p><div class="fieldgrid"><div class="field"><label for="queue" data-i18n="web.text.sonos_queue"></label><select id="queue" disabled><option data-i18n="web.text.use"></option><option data-i18n="web.text.do_not_use"></option></select></div><div class="field"><label for="continue" data-i18n="web.text.continue_after_track"></label><select id="continue" disabled><option data-i18n="web.text.enabled"></option><option data-i18n="web.text.disabled"></option></select></div><div class="field"><label for="buffer" data-i18n="web.text.audio_buffer_mib"></label><input id="buffer" type="number" value="16" min="16" max="512" disabled></div></div><div class="panel-footer"><span data-i18n="web.text.read_only_configuration_overrides_and_service_restarts_will"></span><button class="btn" disabled data-i18n="web.text.save"></button></div></div>
<div class="subpanel" id="display"><h2 data-i18n="web.text.display"></h2><p data-i18n="web.text.display_settings_on_the_device_and_in_the"></p><div class="fieldgrid"><div class="field"><label for="lang" data-i18n="web.text.language"></label><select id="lang" disabled><option data-i18n="web.text.deutsch"></option><option data-i18n="web.text.english"></option></select></div><div class="field"><label for="cover" data-i18n="web.text.cover_on_display"></label><select id="cover" disabled><option data-i18n="web.text.automatic"></option><option data-i18n="web.text.off"></option><option data-i18n="web.text.on"></option></select></div><div class="field span">
<label for="theme-setting" data-i18n="web.text.web_client_color_theme"></label>
<select id="theme-setting">
<option value="auto" data-i18n="web.text.automatic_browser_setting"></option>
<option value="light" data-i18n="web.text.light_teal"></option>
<option value="dark" data-i18n="web.text.dark_espresso_amber"></option>
</select>
<span class="help" data-i18n="web.text.automatic_follows_this_browsers_light_dark_setting_your"></span>
</div></div>
<div class="theme-example" aria-live="polite"><span class="swatch" aria-hidden="true"></span><span class="theme-example-label" id="theme-example-label" data-i18n="web.text.current_theme_light_teal"></span></div>
<div class="panel-footer"><span data-i18n="web.text.web_theme_web_json_active_device_settings_will"></span><button class="btn" id="save-theme" data-i18n="web.text.save_theme"></button></div></div>
<div class="subpanel" id="network"><h2 data-i18n="web.text.network"></h2><p data-i18n="web.text.connection_information_existing_wi_fi_setup_remains_a"></p><div class="record"><div><strong data-i18n="web.text.network_status"></strong><small data-i18n="web.text.network_status_is_not_yet_checked_separately"></small></div><span class="tag" data-i18n="web.text.unknown"></span></div><div class="pill-note" data-i18n="web.text.passwords_and_other_secret_credentials_are_never_shown"></div></div>
<div class="subpanel" id="system"><h2 data-i18n="web.text.device"></h2><p data-i18n="web.text.local_device_information_and_future_management_functions"></p><div class="record"><div><strong>SonosCDPlayer</strong><small data-i18n="web.text.web_service_port_8081"></small></div><span class="tag" data-i18n="web.text.preview"></span></div><div class="record"><div><strong data-i18n="web.text.configuration"></strong><small><span data-i18n="web.text.etc_sonoscdplayer_base_settings_read_only_for_services"></span><br><span data-i18n="web.text.var_lib_sonoscdplayer_settings_saved_by_the_menu"></span></small></div></div><div class="pill-note" data-i18n="web.text.restart_diagnostics_device_name_and_advanced_settings_will"></div></div>
</div></div></section>
</main></div>
<div class="modal-backdrop" id="modal" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title" data-i18n="web.text.delete_entry"></h3><p id="modal-text" data-i18n="web.text.reset_cached_metadata_for_the_inserted_cd_and"></p><div class="modalfooter"><button class="btn secondary" id="modal-cancel" data-i18n="web.text.cancel"></button><button class="btn danger" id="modal-confirm" data-i18n="web.text.delete"></button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
