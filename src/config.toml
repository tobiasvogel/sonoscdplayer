[streaming]
max_buffer_mib = 16

[audio_startup]
prebuffer_before_sonos = true
pcm_timeout_seconds = 45

[drive_power]
enabled = true
strategy = "auto" # off | start | keepalive | power_condition | auto
keepalive_interval_seconds = 10

# Advanced: only fields advertised as changeable are written.
# Volatile only; NEVER --save. No writes without explicit overrides.
# [drive_power.mode_page_overrides]
# IACT = 0

[service]
shutdown_policy = "stop_owned" # stop_owned | leave_playing

[led_outputs]
power_pin = 12
connection_pin = 13
pwm_hz = 200
tick_ms = 25
brightness = 0.7
active_high = true
error_hold_ms = 3000

[led_outputs.ambient]
enabled = true
socket_path = "/run/apds9306.sock"
timeout_ms = 150
poll_ms = 1000
stale_ms = 5000
smoothing_ms = 2000
min_brightness = 0.05
max_brightness = 0.85
fallback_brightness = 0.70
lux_dark = 1.0
lux_bright = 100.0