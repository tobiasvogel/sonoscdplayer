[streaming]
max_buffer_mib = 16

# CD metadata: CD-TEXT (read once right after the TOC), then MusicBrainz.
# A failed online lookup is tried once more after 2 minutes.
[metadata]
enabled = true
read_cd_text = true
online_lookup = true
# Autoselect only when textual evidence clearly separates release candidates.
auto_match = true

[metadata.matching]
# Heuristic agreement score (0..100), not a probability.
confidence_threshold = 90
# Require this lead over the second-ranked release.
minimum_margin = 15
# Minimum number of CD-TEXT track titles for ambiguous DiscIDs.
minimum_track_titles = 3
# Optional independent community language packs under src/metadata_rules/.
# Not tied to the device's UI language.
rule_languages = []
# Exact trailing (...) or [...] descriptors. Extend in any language.
# Soft terms reduce the match slightly when they differ.
soft_suffixes = ["Sing mit", "TV Version"]
# Protected terms never silently match a different edition/recording.
protected_suffixes = ["Live", "Instrumental", "Remastered", "Deluxe"]

# First external metadata provider; a one-shot request after local TOC.
[metadata.musicbrainz]
enabled = true
timeout_seconds = 8

[sonos]
# Put before the album name that Sonos shows for a CD (track title, artist,
# album and cover come from the CD metadata). Empty string: no prefix.
album_prefix = "CD: "
# Play from the Sonos queue (our item is appended last and removed again
# afterwards): only then does the Sonos app show artist and album. Not used
# while shuffle or repeat is on. false: set the stream directly (title only).
use_queue = true

[playback]
# Like a CD player: after a track has played to its end, the next one
# follows; after the last track the player stops. false: stop after each track.
continue = true

[audio_startup]
prebuffer_before_sonos = true
pcm_timeout_seconds = 45

[drive_power]
enabled = true
strategy = "auto" # off | start | keepalive | power_condition | auto
keepalive_interval_seconds = 10
# Default: spin down after 2 minutes of safe inactivity.
# Configurable: 30..86400 seconds.
idle_spin_down_seconds = 120

# Advanced: only fields advertised as changeable are written.
# Volatile only; NEVER --save. No writes without explicit overrides.
# [drive_power.mode_page_overrides]
# IACT = 0

[service]
shutdown_policy = "stop_owned" # stop_owned | leave_playing
# EXPERIMENTAL: use the explicit installer to enable/disable auto-staging.
# Graphic precedes poweroff; wait for completed ACT LED shutdown flashes.
experimental_safe_screen = false

# Optional OLED hardware pins. Legacy defaults are DC=25, RESET=24.
# For the revised button PCB, set DC=22 and RESET=27 locally.
# [display]
# controller = "ssd1327" # Future controllers require their own driver
# interface = "spi"    # i2c reserved for future compatible drivers
# spi_bus = 0
# spi_device = 0
# dc_pin = 22
# rst_pin = 27

[gpio]
# Show RPi.GPIO library warnings such as "This channel is already in use".
# Applies to LEDs, early boot LED, OLED control pins and button inputs.
# Such warnings are expected during service hand-overs; enable for diagnostics only.
warnings = false

[led_outputs]
power_pin = 12
connection_pin = 13
pwm_hz = 200
tick_ms = 25
brightness = 0.7
active_high = true
error_hold_ms = 3000

[led_outputs.ambient]
enabled = true
socket_path = "/run/apds9306.sock"
timeout_ms = 150
poll_ms = 1000
stale_ms = 5000
smoothing_ms = 2000
min_brightness = 0.05
max_brightness = 0.85
fallback_brightness = 0.70
lux_dark = 1.0
lux_bright = 100.0