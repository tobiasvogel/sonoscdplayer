# M0.12c-r1: BCM numbers from the original prototype; no direct Sonos actions.
[gpio]
numbering = "BCM"
poll_interval_ms = 2

[buttons]
power = 17
connect = 21
eject = 20
previous = 15
stop = 18
playpause = 14
skip = 16
volume_up = 27
volume_dn = 22

# Power button: a short press opens the power menu on the OLED; holding it for
# long_press_ms (minimum 3000) shuts the player down directly.
[power]
long_press_ms = 3000

[encoder]
encoder_a = 6
encoder_b = 26
encoder_sw = 5

# For the supplied 3.3V Schmitt-trigger PCB, buttons go HIGH on press.
# For simple buttons to ground, use pull="up", active_level="low".
[input_defaults]
pull = "off"          # off | up | down
active_level = "high" # high | low
debounce_ms = 0       # per-button software stabilization, 0 disables

[encoder_input]
pull = "off"
active_level = "low" # applies to encoder push switch only
button_debounce_ms = 0
steps_per_detent = 4  # count valid quadrature state transitions
# Set true to reverse encoder scroll direction without swapping GPIO wiring.
# false keeps the existing clockwise/counterclockwise mapping.
invert_direction = false

# Override each button individually when mixing types of interface.
# [button_overrides.stop]
# pull = "up"
