# Optional SonosCDPlayer interface preferences. Independent of Linux locale.
[ui]
language = "de" # de | en
# Text rasterization on the display; restart the OLED service after changing.
use_antialiasing = false # false: crisp pixels | true: smooth edges

[ui.cover]
mode = "auto" # auto: use covers on cover-capable displays | on | off
# One cached JPEG per release; no upscaling.
max_dimension_px = 512 # 64..2048
jpeg_quality = 85      # 40..95
# Total size of stored covers. When full, stored covers are kept and new
# ones are not stored (shown again once space is freed).
budget_mb = 100        # 1..10000

[ui.text_input]
# Characters offered in addition to ASCII when typing a name on the device
# (e.g. a hidden Wi-Fi network). Wi-Fi passwords are always ASCII.
extra_characters = "äöüÄÖÜß"
